plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'checkstyle'
}

group = 'com.jsonflattener'
version = '1.0.0'
sourceCompatibility = '11'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testImplementation 'org.assertj:assertj-core:3.24.2'
}

// 1. Фикс кодировки
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'com.jsonflattener.Main'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.8"
}

// Проверка покрытия (исключаем Main)
jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'CLASS'
            excludes = [
                'com.jsonflattener.Main',
                'com.jsonflattener.model.*'
            ]
            limit {
                minimum = 0.75
            }
        }
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// --- CHECKSTYLE (НАДЕЖНЫЙ МЕТОД ДЛЯ CI/CD) ---

checkstyle {
    // Используем свежую версию, совместимую с Java 11
    toolVersion = '10.12.0'
    ignoreFailures = false // Пусть падает, если есть ошибки стиля
    
    // Указываем путь к файлу, который мы создадим сами
    configFile = file("${buildDir}/checkstyle.xml")
}

// Задача для генерации конфига перед проверкой
task writeCheckstyleConfig {
    doLast {
        def configContent = """<?xml version="1.0"?>
<!DOCTYPE module PUBLIC
        "-//Checkstyle//DTD Checkstyle Configuration 1.3//EN"
        "https://checkstyle.org/dtds/configuration_1_3.dtd">
<module name="Checker">
    <property name="charset" value="UTF-8"/>
    <module name="TreeWalker">
        <module name="LineLength">
            <property name="max" value="120"/>
        </module>
    </module>
</module>"""
        
        def file = file("${buildDir}/checkstyle.xml")
        file.parentFile.mkdirs()
        file.write(configContent, "UTF-8")
        println "Checkstyle config created at: " + file.absolutePath
    }
}

// Привязываем генерацию к задачам проверки
checkstyleMain.dependsOn writeCheckstyleConfig
checkstyleTest.dependsOn writeCheckstyleConfig

// Отключаем Checkstyle локально на Windows, чтобы не было проблем с OneDrive
// Но включаем на CI (GitHub)
if (System.getenv('CI') != 'true') {
    tasks.withType(Checkstyle) {
        enabled = false
    }
}

task runApp(type: JavaExec) {
    group = 'Application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.jsonflattener.Main'
    systemProperty "INPUT_JSON", System.getenv('INPUT_JSON') ?: 'data/input.json'
}

check.dependsOn jacocoTestCoverageVerification