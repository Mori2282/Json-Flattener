plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'checkstyle'
}

group = 'com.jsonflattener'
version = '1.0.0'
sourceCompatibility = '11'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testImplementation 'org.assertj:assertj-core:3.24.2'
}

// 1. Фикс кодировки для Windows
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'com.jsonflattener.Main'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.8"
}

// Проверка покрытия (исключаем Main и model)
jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'CLASS'
            excludes = ['com.jsonflattener.Main', 'com.jsonflattener.model.*']
            limit {
                minimum = 0.75
            }
        }
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// --- CHECKSTYLE (АВТОНОМНЫЙ РЕЖИМ) ---

checkstyle {
    // Версия 8.45.1 самая стабильная и не требует сложных конфигов
    toolVersion = '8.45.1'
    ignoreFailures = false
    configFile = file("${buildDir}/checkstyle.xml")
}

// Задача создает конфиг БЕЗ ссылок на интернет (DTD), чтобы не падало на GitHub
task writeCheckstyleConfig {
    doLast {
        def configContent = """<?xml version="1.0"?>
<module name="Checker">
    <property name="charset" value="UTF-8"/>
    <module name="TreeWalker">
        <module name="LineLength">
            <property name="max" value="120"/>
        </module>
    </module>
</module>"""
        
        def file = file("${buildDir}/checkstyle.xml")
        file.parentFile.mkdirs()
        file.write(configContent, "UTF-8")
        println "Checkstyle config generated at: " + file.absolutePath
    }
}

checkstyleMain.dependsOn writeCheckstyleConfig
checkstyleTest.dependsOn writeCheckstyleConfig

// Локально на Windows отключаем, чтобы не ругался на OneDrive
// На GitHub Actions (CI=true) включаем
if (System.getenv('CI') != 'true') {
    tasks.withType(Checkstyle) {
        enabled = false
    }
}

task runApp(type: JavaExec) {
    group = 'Application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.jsonflattener.Main'
    systemProperty "INPUT_JSON", System.getenv('INPUT_JSON') ?: 'data/input.json'
}

check.dependsOn jacocoTestCoverageVerification